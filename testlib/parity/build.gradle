plugins {
    id 'java-library'
}

group = 'io.github.jemmix'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    // The four columns: sim reference (:lib:pikesim → :core), engine facade (→ :asm),
    // and the external oracle re2j.
    api project(':lib:pikesim')
    api project(':')
    api project(':re2j')
    // re2j is the oracle's API at COMPILE time only. Which re2j answers at
    // runtime is the consumer's call (:tests:parity:re2j puts the vendored
    // pristine oracle on the classpath) — carrying the released 1.8 artifact
    // transitively would put a second com.google.re2j on every consumer's
    // runtime classpath, to be shadowed or not by classpath order.
    compileOnly 'com.google.re2j:re2j:1.8'
}

jar {
    manifest {
        attributes 'Automatic-Module-Name': 'io.github.jemmix.tdfa.parity.testlib'
    }
}
