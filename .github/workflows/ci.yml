name: ci

# Deliberately minimal and boring.
# Floor policy: core+asm+facade+re2j ship Java 8 bytecode; pikesim/unicode
# ship Java 25 (latest LTS). Jobs:
#   check: a 5-leg matrix, all on the public-repo ARM pool (ubuntu-24.04-arm
#       — comparable core count to ubuntu-latest, faster single core, far
#       shorter queue). The old single `check` job put ~95% of its ~11 min
#       into four test tasks; the legs give each of them a whole runner:
#         lint      — compile + ErrorProne + checkstyle + spotless + TODO
#                     gate (check minus every test task)
#         unit      — :tests:unit:test forked (-Ptdfa.testForks=3), plus the
#                     tiny :tests:parity:rebar:test piggybacked here
#         parity-re2j     — :tests:parity:re2j:test, forked (-Ptdfa.testForks=3;
#                     in-JVM class parallelism is unsound here — the suite's
#                     budget/engine system-property swaps are JVM-global, see
#                     tests/parity/re2j/build.gradle)
#         parity-re2j-suite-asm — re2j corpus, ASM backend (test)
#         parity-re2j-suite-vm  — re2j corpus, VM backend (testOnVm); the
#                     two suite legs are separate because both run the same
#                     single vendored ExecTest class — intra-suite forking
#                     cannot split one class across forks, so parallelism
#                     comes from one runner per leg instead.
#   spotbugs: JDK 25 (4.9.x cannot scan JDK 26 runtime classes; the build
#       self-skips it there, so this row is where it actually ENFORCES),
#   jars-and-tests: THE floor proof — core+asm+facade+re2j compiled by a
#       REAL JDK 8 javac (Gradle toolchain, -PrealJdk8), the rest by JDK 25;
#       then the unit tests are compiled AND run on JDK 25 against the
#       packaged jars (-PagainstJars); then a runtime smoke compiled+run on
#       the JDK 8 itself against the core+asm+facade+re2j jars.
# Actions are pinned by commit SHA; bump deliberately.

on:
  push:
    branches: [main]
    # Doc-only pushes to main skip the gate (a PR already gated the merge);
    # pull_request deliberately has NO path filter — required checks must
    # always report.
    paths-ignore: ['**.md', 'docs/**']
  pull_request:

# Superseded runs of the same branch/PR don't queue up duplicating full gates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check / ${{ matrix.leg }} (JDK 26, arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      # Every leg reports even if a sibling failed — full picture per run.
      fail-fast: false
      matrix:
        include:
          - leg: lint
            gradle: 'check -x test -x testOnVm'
          - leg: unit
            gradle: ':tests:unit:test :tests:parity:rebar:test -Ptdfa.testForks=3'
          - leg: parity-re2j
            gradle: ':tests:parity:re2j:test -Ptdfa.testForks=3'
          - leg: parity-re2j-suite-asm
            gradle: ':tests:parity:re2j-suite:test'
          - leg: parity-re2j-suite-vm
            gradle: ':tests:parity:re2j-suite:testOnVm'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      - run: ./gradlew ${{ matrix.gradle }} --stacktrace

  spotbugs:
    name: spotbugs (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      # Tasks self-skip (loudly) on JDK >= 26; on 25 they enforce with
      # hard-fail on findings AND analysis errors.
      - run: ./gradlew spotbugsMain spotbugsTest --stacktrace

  jars-and-tests:
    name: jars by jdk 8 + unit tests on jdk 25 (latest LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Install 8 FIRST, 25 LAST: the last install becomes JAVA_HOME (the
      # Gradle daemon runs on 25); the JDK 8 install is picked up by Gradle
      # toolchain auto-detection (JAVA_HOME_8_x64) for -PrealJdk8.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      # Builds all seven shipped jars (core+asm+facade+re2j via a real JDK 8 javac;
      # the rest via JDK 25 / --release 25) and runs the unit suite against
      # the PACKAGED jars on the JDK 25 daemon. BytecodeFloorTest then pins
      # the very jars this job produces.
      - name: Build jars (core+asm+facade+re2j with real JDK 8 javac) + unit tests vs jars (JDK 25)
        run: ./gradlew :tests:unit:test -PrealJdk8 -PagainstJars --stacktrace
      - name: Switch to a real JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Smoke on JDK 8 (compile + run against the core+asm+facade+re2j jars)
        run: |
          set -euxo pipefail
          java -version
          # asm's only runtime dependency: asm 9.9.1 (major 49 — Java 5
          # bytecode, runs everywhere incl. 8). Pinned by sha256.
          curl -fsSLo /tmp/asm-9.9.1.jar \
            https://repo1.maven.org/maven2/org/ow2/asm/asm/9.9.1/asm-9.9.1.jar
          echo "6f3828a215c920059a5efa2fb55c233d6c54ec5cadca99ce1b1bdd10077c7ddd  /tmp/asm-9.9.1.jar" | shasum -a 256 -c -
          CP="build/libs/tdfa-0.1.0-SNAPSHOT.jar:core/build/libs/core-0.1.0-SNAPSHOT.jar:asm/build/libs/asm-0.1.0-SNAPSHOT.jar:re2j/build/libs/re2j-0.1.0-SNAPSHOT.jar:/tmp/asm-9.9.1.jar"
          rm -rf /tmp/smoke8 && mkdir -p /tmp/smoke8   # javac does not create -d dirs
          javac -cp "$CP" -d /tmp/smoke8 ci/Smoke8.java
          java -cp "/tmp/smoke8:$CP" Smoke8
