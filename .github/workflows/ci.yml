name: ci

# Deliberately minimal and boring (2026-09, the "decade-stable" posture).
# Floor policy r4 (docs/REVIEW-2026-09.md §1d): core+asm ship Java 8
# bytecode; facade/pikesim/unicode ship Java 25 (latest LTS). Three jobs:
#   check: full gate on a current JDK (everything; EP lint runs inside
#       compile via --release cross-compilation),
#   spotbugs: JDK 25 (4.9.x cannot scan JDK 26 runtime classes; the build
#       self-skips it there, so this row is where it actually ENFORCES),
#   jars-and-tests: THE floor proof — core+asm compiled by a REAL JDK 8
#       javac (Gradle toolchain, -PrealJdk8), the rest by JDK 25; then the
#       unit tests are compiled AND run on JDK 25 against the packaged jars
#       (-PagainstJars); then a runtime smoke compiled+run on the JDK 8
#       itself against the core+asm jars.
# Actions are pinned by commit SHA; bump deliberately.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: build + check (JDK 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      - run: ./gradlew check --stacktrace

  spotbugs:
    name: spotbugs (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      # Tasks self-skip (loudly) on JDK >= 26; on 25 they enforce with
      # hard-fail on findings AND analysis errors.
      - run: ./gradlew spotbugsMain spotbugsTest --stacktrace

  jars-and-tests:
    name: jars by jdk 8 + unit tests on jdk 25 (latest LTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Install 8 FIRST, 25 LAST: the last install becomes JAVA_HOME (the
      # Gradle daemon runs on 25); the JDK 8 install is picked up by Gradle
      # toolchain auto-detection (JAVA_HOME_8_x64) for -PrealJdk8.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      # Builds all six shipped jars (core+asm via a real JDK 8 javac; the
      # rest via JDK 25 / --release 25) and runs the unit suite against the
      # PACKAGED jars on the JDK 25 daemon. BytecodeFloorTest then pins the
      # very jars this job produces.
      - name: Build jars (core+asm with real JDK 8 javac) + unit tests vs jars (JDK 25)
        run: ./gradlew :tests:unit:test -PrealJdk8 -PagainstJars --stacktrace
      - name: Switch to a real JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Smoke on JDK 8 (compile + run against the core+asm jars)
        run: |
          set -euxo pipefail
          java -version
          # asm's only runtime dependency: asm 9.9.1 (major 49 — Java 5
          # bytecode, runs everywhere incl. 8). Pinned by sha256.
          curl -fsSLo /tmp/asm-9.9.1.jar \
            https://repo1.maven.org/maven2/org/ow2/asm/asm/9.9.1/asm-9.9.1.jar
          echo "6f3828a215c920059a5efa2fb55c233d6c54ec5cadca99ce1b1bdd10077c7ddd  /tmp/asm-9.9.1.jar" | shasum -a 256 -c -
          CP="core/build/libs/core-0.1.0-SNAPSHOT.jar:asm/build/libs/asm-0.1.0-SNAPSHOT.jar:/tmp/asm-9.9.1.jar"
          javac -cp "$CP" -d /tmp/smoke8 ci/Smoke8.java
          java -cp "/tmp/smoke8:$CP" Smoke8
