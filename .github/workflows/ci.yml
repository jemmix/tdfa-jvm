name: ci

# Deliberately minimal and boring (2026-09, the "decade-stable" posture):
# three jobs —
#   build+check on a current JDK (everything: EP lint runs inside compile),
#   SpotBugs on JDK 25 (4.9.x cannot scan JDK 26 runtime classes; the build
#       self-skips it there, so this row is where it actually ENFORCES),
#   java8-floor: rebuild the shipped jars, then compile+run a smoke main on a
#       real JDK 8 against them (the --release 8 cross-compile is proven on a
#       genuine 8 runtime, not just by classfile version).
# Actions are pinned by commit SHA; bump deliberately.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: build + check (JDK 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      - run: ./gradlew check --stacktrace

  spotbugs:
    name: spotbugs (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      # Tasks self-skip (loudly) on JDK >= 26; on 25 they enforce with
      # hard-fail on findings AND analysis errors.
      - run: ./gradlew spotbugsMain spotbugsTest --stacktrace

  java8-floor:
    name: java 8 runtime floor (build 26, run 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '26'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      - name: Build shipped jars (cross-compiled --release 8)
        run: ./gradlew :jar :core:jar :asm:jar :lib:pikesim:jar :unicode:v6_0:jar
      - name: Switch to a real JDK 8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Smoke on JDK 8 (compile + run against the jars)
        run: |
          set -euxo pipefail
          java -version
          # The facade's only runtime dependency: asm 9.9.1 (major 49 — Java 5
          # bytecode, runs everywhere incl. 8). Pinned by sha256.
          curl -fsSLo /tmp/asm-9.9.1.jar \
            https://repo1.maven.org/maven2/org/ow2/asm/asm/9.9.1/asm-9.9.1.jar
          echo "6f3828a215c920059a5efa2fb55c233d6c54ec5cadca99ce1b1bdd10077c7ddd  /tmp/asm-9.9.1.jar" | shasum -a 256 -c -
          CP="build/libs/tdfa-0.1.0-SNAPSHOT.jar:core/build/libs/core-0.1.0-SNAPSHOT.jar:asm/build/libs/asm-0.1.0-SNAPSHOT.jar:$(ls lib/pikesim/build/libs/*.jar | head -1):$(ls unicode/v6_0/build/libs/*.jar | head -1):/tmp/asm-9.9.1.jar"
          javac -cp "$CP" -d /tmp/smoke8 ci/Smoke8.java
          java -cp "/tmp/smoke8:$CP" Smoke8
