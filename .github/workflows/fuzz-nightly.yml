name: nightly-fuzz

# DOA on GitHub-hosted hardware (2026-11-08) — do not run soaks on GitHub's
# runners, nightly OR manual dispatch. A 4h x2 unattended soak tenancy per
# night on gratis shared compute was judged an undue burden on the platform,
# with a real risk of the account being banned. Soaks and the issue gate
# below run identically on local hardware:
#   scripts/fuzz-soak.sh 240 1 build/fuzz-nightly <seedBase>
#   python3 scripts/fuzz-nightly-issue.py build/fuzz-nightly
# This file stays as the documented contract (soak shape, record kinds,
# gate/dedup behavior, evidence layout) — not as an invitation to run it.

# Widest-surface differential soak. scripts/fuzz-soak.sh runs
# the chunked DifferentialFuzzer (one short-lived JVM per minute — hang-leak
# containment) with ALL widening defaults left on:
#   - lane mix: per-batch draw between the re2j surface vs the patched re2j
#     oracle AND the jur facade vs live java.util.regex;
#   - multi-valued lane (BT22 §3.1): MULTI_VALUED_TAGS compiles per batch
#     under the four MVT oracles (self-consistency, latest==plain, tier
#     equality, PikeSim write-log) plus forced rungs and stretch;
#   - cross-rung differential (forced complete-search rungs) + stretch;
#   - determinism double-run (runner-immutability tripwire);
#   - GC logging on, JFR hang watch on.
# Default length 240 chunks x 1 min = 4 h (plus ~5-15 s gradle+JIT per chunk
# and the post-soak hang-replay verification pass).
#
# Findings: scripts/fuzz-nightly-issue.py reads the soak's failures.ndjson,
# drops the counted-but-not-findings kinds (KNOWN_DIVERGENCE, JURLANE_SKIP,
# JURLANE_GUARD, BUDGET_REJECT, HANG_ORACLE) and opens ONE issue per run —
# only if some mismatch SIGNATURE (kind + structural pattern shape, the
# fuzzer's own dedup) is not already tracked by an open nightly-fuzz issue.
# Clean or all-known nights stay silent. Manual runs: workflow_dispatch
# (minutes/seed inputs; seed 0 = random).

on:
  # Nightly cron parked 2026-11-01, in-repo (not the GitHub toggle): the
  # pipeline proved itself end-to-end (issue #127 + the evidence artifact,
  # runs 41028994833/41061641546), and an unattended 4h runner tenancy per
  # night is more than the campaign wanted to burn while #127 triage was
  # manual. Then ruled DOA entirely (2026-11-08, see the banner above):
  # never resume the schedule onto GitHub-hosted runners — a resumed
  # nightly lives on self-hosted or local hardware only, which needs no
  # workflow at all (fuzz-soak.sh + fuzz-nightly-issue.py).
  # schedule:
  #   # 02:30 UTC — off the top-of-hour cron stampede.
  #   - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'soak length in minutes (chunks x 1 min)'
        default: '240'
      seed:
        description: 'seed base (0 = random)'
        default: '0'

# Never cancel a soak mid-flight for a concurrency collision.
concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  fuzz:
    name: differential fuzz soak (4h, both lanes)
    # Schedules only fire on the default branch's copy of this file; the
    # guard keeps forks that DO enable it from filing issues upstream-style.
    if: github.repository == 'jemmix/tdfa-jvm'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          validate-wrappers: true
      - name: Chunked differential soak (mix lanes, cross-rung + double-run on)
        env:
          SOAK_MINUTES: ${{ inputs.minutes || '240' }}
          SOAK_SEED: ${{ inputs.seed || '0' }}
        run: |
          set -euxo pipefail
          if [ "$SOAK_SEED" = "0" ]; then
            scripts/fuzz-soak.sh "$SOAK_MINUTES" 1 build/fuzz-nightly
          else
            scripts/fuzz-soak.sh "$SOAK_MINUTES" 1 build/fuzz-nightly "$SOAK_SEED"
          fi
      # always(): findings from a partially-completed soak are still findings.
      - name: Open issue on new mismatches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/fuzz-nightly-issue.py build/fuzz-nightly "$RUN_URL"
      # The night's evidence must outlive the runner. failures.ndjson (every
      # record + caseSeed), iterations.log (the seed base), issue-body.md, the
      # hang-<caseSeed>.jfr dumps. Anything short of a fully green run uploads:
      # a reporter crash must never again eat the findings it was reporting
      # (2026-10-30, run 41028994833 — the crash above is what this guards),
      # and a cancelled mid-soak still holds its partial-chunk records.
      - name: Upload soak evidence
        if: '!success()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-nightly-evidence
          path: build/fuzz-nightly/
          retention-days: 30
