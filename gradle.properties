# Single source of truth for the project version (per-module `version`
# declarations would drift with no single bump point). Subprojects inherit
# the root project version; do not set `version` per-module.
version=0.1.0-SNAPSHOT

# Task-output build cache. gradle/actions/setup-gradle persists Gradle User
# Home (cache store included) between CI runs, so unchanged modules compile,
# lint and even test FROM-CACHE instead of re-executing — a docs-only PR or
# a re-run after a force-push skips everything it did not touch.
org.gradle.caching=true
