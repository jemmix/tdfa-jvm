plugins {
    id 'java-library'
}

group = 'io.github.jemmix'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

dependencies {
    // Evergreen pipeline + core API tier (interpreter reference implementation).
    api project(':core')
    // ASM bytecode backend (M4)
    implementation 'org.ow2.asm:asm:9.9.1'
}

// Materialize vendored third-party sources/resources into build/generated/.
// Subprojects with generated sourceSets (e.g. :tests:parity:re2j-suite) depend
// on this task. Safe to run any time; idempotent.
tasks.register('prepareVendor', Exec) {
    description = 'Extract vendor archives into build/generated/ and apply patches.'
    group = 'build'
    commandLine './scripts/vendor.sh', 'prepare'
    inputs.files fileTree('vendor')
    outputs.dir layout.buildDirectory.dir('generated')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = true
}
