plugins {
    id 'java-library'
    // Static analysis (2026-09 pre-freeze round), versions declared here and
    // inherited by :core and :asm. Kept deliberately minimal and centralized:
    // ErrorProne (compile-time semantic checks, also usable as a plain javac
    // plugin — decade-stable invocation) and SpotBugs (bytecode analysis over
    // the jar, also runnable standalone via `java -jar spotbugs.jar -textui`).
    // Applied only to the three library modules (facade, core, asm) —
    // tests/benchmarks stay lint-free.
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'com.github.spotbugs' version '6.5.11'
    id "org.jetbrains.qodana" version "2026.2.1"
    // Codestyle reformatter (2026-09): version declared here, applied to all
    // non-generated modules from the codestyle block below.
    id 'com.diffplug.spotless' version '8.10.2'
}

qodana {
    resultsPath = "build/qodana-result"
}

tasks.qodanaScan {
    arguments = ["--print-problems", "--fail-threshold", "0"]
}

group = 'io.github.jemmix'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    // Evergreen pipeline + core API tier (interpreter reference implementation).
    api project(':core')
    // Per-pattern bytecode generation backend; the facade orchestrates it
    // directly (no engine SPI — the module graph is the strategy).
    api project(':asm')
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    spotbugs 'com.github.spotbugs:spotbugs:4.9.8'
}

// Materialize vendored third-party sources/resources into build/generated/.
// Subprojects with generated sourceSets (e.g. :tests:parity:re2j-suite) depend
// on this task. Safe to run any time; idempotent.
tasks.register('prepareVendor', Exec) {
    description = 'Extract vendor archives into build/generated/ and apply patches.'
    group = 'build'
    commandLine './scripts/vendor.sh', 'prepare'
    inputs.files fileTree('vendor')
    outputs.dir layout.buildDirectory.dir('generated')
}


jar {
    manifest {
        attributes 'Automatic-Module-Name': 'io.github.jemmix.tdfa'
    }
}

// Java 8 floor, two enforcement modes (2026-09 r5, docs/REVIEW-2026-09.md §1d):
//  - default: cross-compile with --release 8 (language level AND API surface
//    via ct.sym; ErrorProne still hosted inside the compiler).
//  - -PrealJdk8 (the CI jar pipeline): pin the compiler toolchain to a REAL
//    JDK 8 javac — the strongest possible compat proof. javac 8 has no
//    --release flag, and ErrorProne 2.x cannot host inside it (needs 17+),
//    so both are dropped in that mode only.
def realJdk8 = providers.gradleProperty('realJdk8').isPresent()
if (realJdk8) {
    java.toolchain.languageVersion = JavaLanguageVersion.of(8)
}

tasks.withType(JavaCompile).configureEach {
    if (realJdk8) {
        options.errorprone.enabled = false
    } else {
        it.options.release = 8
    }
    options.encoding = 'UTF-8'
    options.debug = true
    // Style-modernization checks disabled on a freeze-bound codebase: the
    // mechanical rewrites (pattern-matching instanceof, arrow switches)
    // churn verified-hot code paths for zero semantic gain. Re-enable only
    // with a dedicated no-behavior-change round + full perf gate.
    options.errorprone {
        disable 'PatternMatchingInstanceof'
        disable 'StatementSwitchToExpressionSwitch'
    }
}

// SpotBugs: hard-fails on findings AND on analysis errors (never a false
// green — a degraded analysis exits non-zero). Analyzer 4.9.8 (Java 25
// classfile support). Exclusions are exclusively documented deferred review
// items — see config/spotbugs/exclusions.xml. On JDK >= 26 the tasks
// self-skip (SpotBugs cannot scan JDK 26 runtime classes); on <= 25 they
// enforce. Standalone: scripts/lint-spotbugs.sh. Triage: docs/REVIEW-2026-09.md.
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    ignoreFailures = false
    excludeFilter = rootProject.file('config/spotbugs/exclusions.xml')
    onlyIf {
        if (org.gradle.api.JavaVersion.current().majorVersion.toInteger() >= 26) {
            logger.lifecycle("spotbugs: skipped - SpotBugs 4.9.x cannot scan JDK 26 runtime classes; run scripts/lint-spotbugs.sh on JDK <= 25")
            false
        } else {
            true
        }
    }
    reports {
        xml.required = true
        html.required = true
    }
}

// Codestyle (2026-09): one ruleset, three cooperating artifacts under
// config/codestyle/ — change them together:
//  - tdfa-idea.xml: importable IntelliJ scheme (IDE reformat == CI-clean).
//  - eclipse-formatter.properties: the machine formatter, driven by
//    spotless (`spotlessApply` reformats, `spotlessCheck` gates).
//  - checkstyle.xml: the checks formatters cannot rewrite (mandatory
//    braces, no star imports, member order, no tabs).
// Rules: flat 4-space continuation indent, right margin 120, joins wraps
// that fit, imports not qualified names (same-simple-name collisions stay
// qualified). `spotlessApply` reformats, `spotlessCheck` gates — both bind
// into `check`, so the CI check job enforces everything.
// Unlike ErrorProne/SpotBugs this applies to ALL modules (style rules are
// text-only, no analysis deps) — the only exemptions are machine-generated
// or vendored code:
//   :unicode:*     — regenerated tables (scripts/gen-unicode.py output)
//   :tests:parity:re2j-suite — vendored re2j sources (materialized under
//                   build/generated by :prepareVendor)
def codestyleExempt = [':unicode:v6_0', ':unicode:v17_0', ':tests:parity:re2j-suite'] as Set
allprojects {
    // withPlugin('java'): container dirs (:tests, :benchmarks, ...) have no
    // java plugin and no sources — skip them. Fires for java-library/jmh
    // modules too (they apply `java` internally).
    pluginManager.withPlugin('java') {
        if (path in codestyleExempt) {
            return
        }
        apply plugin: 'checkstyle'
        apply plugin: 'com.diffplug.spotless'

        checkstyle {
            toolVersion = '14.1.0'
            configFile = rootProject.file('config/codestyle/checkstyle.xml')
            ignoreFailures = false   // never a false green (SpotBugs posture)
        }
        tasks.withType(Checkstyle).configureEach {
            reports {
                xml.required = true
                html.required = true
            }
        }

        spotless {
            java {
                // src/{main,test,jmh}/java per module; the root facade also
                // owns ci/Smoke8.java (compiled standalone by the CI jar
                // pipeline, not by Gradle, but still project code).
                if (path == ':') {
                    target 'src/*/java/**/*.java', 'ci/*.java'
                } else {
                    target 'src/*/java/**/*.java'
                }
                // Escape hatch for genuinely formatter-hostile blocks
                // (none in-tree today; documented for future need).
                toggleOffOn()
                // Imports, not qualified names: FQ references are shortened
                // to simple names + imports (types, static call receivers,
                // static field access). Collisions are skipped automatically
                // — when one class uses two same-simple-named types, the FQ
                // form stays (e.g. java.util.regex.Pattern next to our
                // Pattern). Then the layout: others | blank | javax, java |
                // blank | static ('' = all not matched explicitly).
                shortenFullyQualifiedTypes()
                importOrder '', 'javax|java', '\\#'
                // Machine formatter: eclipse JDT with a FLAT 4-space
                // continuation indent. The engine (jdt.core 3.46, token-
                // based) applies continuation_indentation as a multiple of
                // the 4-space indent unit — the properties file pins it to
                // 1 (+4 flat; 2 gives +8, 4 gives +16) and the alignment
                // family to 16 (wrap where necessary). Margin 120, joins
                // wraps that fit, K&R braces, comments never reflowed.
                def eclipseFormatter = eclipse()
                eclipseFormatter.configFile rootProject.file('config/codestyle/eclipse-formatter.properties').absolutePath
                // NOTE: member ORDER is deliberately NOT formatter-driven.
                // Reordering members is not whitespace-only; it is enforced
                // by checkstyle (DeclarationOrder + ConstructorsDeclaration-
                // Grouping) and fixed in-IDE via the tdfa-idea.xml
                // arrangement rules (Code > Rearrange Code).
            }
        }
    }
}
