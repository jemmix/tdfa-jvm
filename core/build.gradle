plugins {
    id 'java-library'
    id 'net.ltgt.errorprone'
    id 'com.github.spotbugs'
}

group = 'io.github.jemmix'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    spotbugs 'com.github.spotbugs:spotbugs:4.9.3'
}

jar {
    manifest {
        attributes 'Automatic-Module-Name': 'io.github.jemmix.tdfa.core'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = true
    // Style-modernization checks disabled on a freeze-bound codebase: the
    // mechanical rewrites (pattern-matching instanceof, arrow switches)
    // churn verified-hot code paths for zero semantic gain. Re-enable only
    // with a dedicated no-behavior-change round + full perf gate.
    options.errorprone {
        disable 'PatternMatchingInstanceof'
        disable 'StatementSwitchToExpressionSwitch'
    }
}

// SpotBugs: hard-fails on findings AND on analysis errors (never a false
// green — a degraded analysis exits non-zero). CAVEAT (2026-09): SpotBugs
// 4.9.x cannot scan JDK 26 runtime classes (class file major 70), so on
// JDK >= 26 the tasks are skipped with a warning instead of failing the
// build; on JDK <= 25 (or once upstream supports it) they enforce. Standalone
// invocation for any JDK: scripts/lint-spotbugs.sh. Triage log:
// docs/REVIEW-2026-09.md.
tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    ignoreFailures = false
    onlyIf {
        if (org.gradle.api.JavaVersion.current().majorVersion.toInteger() >= 26) {
            logger.lifecycle("spotbugs: skipped - SpotBugs 4.9.x cannot scan JDK 26 runtime classes; run scripts/lint-spotbugs.sh on JDK <= 25")
            false
        } else {
            true
        }
    }
    reports {
        xml.required = true
        html.required = true
    }
}
