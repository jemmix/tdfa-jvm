plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation project(':')
    testImplementation project(':unicode:v6_0')
    testImplementation project(':unicode:v17_0')
    // For BytecodeFloorTest: every shipped module must be on the test
    // classpath so its compiled output can be pinned to its floor.
    testImplementation project(':lib:pikesim')
    testImplementation platform('org.junit:junit-bom:5.10.2'),
            'org.junit.jupiter:junit-jupiter',
            'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// CI jar pipeline (-PagainstJars, docs/REVIEW-2026-09.md §1d): compile and
// run the unit tests against the PACKAGED jars of the six shipped modules
// instead of their classes dirs — the exact artifact set a consumer
// receives. DoFirst classpath swap (CI runs fresh; not an up-to-date-safe
// local dev mode).
if (project.hasProperty('againstJars')) {
    def shippedPaths = [':', ':core', ':asm', ':lib:pikesim', ':unicode:v6_0', ':unicode:v17_0']
    def shipped = shippedPaths.collect { project.findProject(it) }
    // String paths resolve lazily — the sibling projects may not be
    // configured yet when this script evaluates.
    def jarPaths = shippedPaths.collect { it == ':' ? ':jar' : it + ':jar' }
    ['compileTestJava', 'test'].each { name ->
        tasks.named(name) {
            dependsOn jarPaths
            doFirst {
                def drop = shipped.collectMany {
                    [it.layout.buildDirectory.dir('classes/java/main').get().asFile,
                     it.layout.buildDirectory.dir('resources/main').get().asFile]*.toString()
                }.toSet()
                def jars = shipped.collect { it.tasks.getByName('jar').archiveFile.get().asFile }
                classpath = files(classpath.files.findAll { !drop.contains(it.toString()) } + jars)
            }
        }
    }
}

test {
    useJUnitPlatform()
    // 2g: RedosBatteryTest's kernel-cap bomb determinizes ~62K states before the
    // clean budget rejection; at 512m the OOM preempts the rejection.
    jvmArgs '-Xmx2g', '-XX:+HeapDumpOnOutOfMemoryError'
    systemProperty 'tdfa.asm.dump', System.getProperty('tdfa.asm.dump', 'false')
    // The JIT inlining guard is its own action (below), never the default gate.
    filter { excludeTestsMatching '*InliningGuard*' }
    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
    }
}

// JIT devirtualization guard for the ASM tier: forks a PrintInlining JVM,
// runs the emitted ladder hot, asserts every generated-class call site
// inlines (no megamorphic dispatch). Separate action — NOT part of check —
// because it depends on HotSpot diagnostic flags and compile timing.
// Full logs: build/reports/inlining-guard/.
tasks.register('inliningGuard', Test) {
    group = 'verification'
    description = 'JIT inlining/devirtualization guard for the generated tier'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching '*InliningGuard*' }
    maxHeapSize = '1g'
    outputs.upToDateWhen { false }
    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
    }
}
