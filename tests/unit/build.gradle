plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation project(':')
    testImplementation project(':unicode:v6_0')
    testImplementation project(':unicode:v17_0')
    testImplementation platform('org.junit:junit-bom:5.10.2'),
            'org.junit.jupiter:junit-jupiter',
            'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // 2g: RedosBatteryTest's kernel-cap bomb determinizes ~62K states before the
    // clean budget rejection; at 512m the OOM preempts the rejection.
    jvmArgs '-Xmx2g', '-XX:+HeapDumpOnOutOfMemoryError'
    // -Dtdfa.pending=true opts IN known-failing tests committed in interim
    // state (TODO.md convention). No currently-known failures: default off.
    systemProperty 'tdfa.pending', System.getProperty('tdfa.pending', 'false')
    systemProperty 'tdfa.asm.dump', System.getProperty('tdfa.asm.dump', 'false')
    // The JIT inlining guard is its own action (below), never the default gate.
    filter { excludeTestsMatching '*InliningGuard*' }
    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
    }
}

// JIT devirtualization guard for the ASM tier: forks a PrintInlining JVM,
// runs the emitted ladder hot, asserts every generated-class call site
// inlines (no megamorphic dispatch). Separate action — NOT part of check —
// because it depends on HotSpot diagnostic flags and compile timing.
// Full logs: build/reports/inlining-guard/.
tasks.register('inliningGuard', Test) {
    group = 'verification'
    description = 'JIT inlining/devirtualization guard for the generated tier'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter { includeTestsMatching '*InliningGuard*' }
    maxHeapSize = '1g'
    outputs.upToDateWhen { false }
    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
    }
}
