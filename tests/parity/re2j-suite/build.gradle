plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation project(':')
    testImplementation platform('org.junit:junit-bom:5.10.2'),
            'org.junit.jupiter:junit-jupiter',
            'junit:junit:4.13.2',
            'com.google.re2j:re2j:1.8',
            'com.google.guava:guava:33.0.0-jre'
    // JUnit4 tests (ExecTest) discovered via Vintage engine at runtime
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Re2jUnicodeProvider bridge lives in :tests:parity:re2j; needs to be on
    // the runtime classpath here for ExecTest's Unicode case-folding paths.
    testRuntimeOnly project(':tests:parity:re2j')
}

// Vendor-wired generated sources (ExecTest, Utils, UnicodeTables, etc.)
// Materialized by the root :prepareVendor task from vendor/re2j-<sha>.tar.gz
// + patches/re2j/01-package-rewrite.patch. Lives under the ROOT project's
// build/ (where prepareVendor writes); referenced here via rootProject.
sourceSets {
    test {
        java.srcDir rootProject.layout.buildDirectory.dir('generated/sources/re2j/java')
        resources.srcDir rootProject.layout.buildDirectory.dir('generated/resources/re2j')
    }
}

tasks.named('compileTestJava') {
    dependsOn rootProject.tasks.named('prepareVendor')
}

tasks.named('processTestResources') {
    dependsOn rootProject.tasks.named('prepareVendor')
}

// Default test task: ASM backend (default engine).
tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'tdfa.engine', 'ASM'
    jvmArgs '-Xmx512m', '-XX:+HeapDumpOnOutOfMemoryError'
    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
    }
}

// Additional Test task: VM backend. Runs the same test classes with a
// different engine selection system property. Ensures re2j's full corpus
// exercises both backends.
//
// Historical note: this task once ran with ignoreFailures=true masking a
// zero-width VM bug (patterns like (?:(?:(?:^)|.)?) matching [0,1] instead
// of [0,0]). Verified fixed well before the 2026-08 restructure (baseline
// 287bdca passes 6/6); the mask was stale and has been removed — this task
// is a hard gate again.
tasks.register('testOnVm', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    systemProperty 'tdfa.engine', 'VM'
    jvmArgs '-Xmx512m', '-XX:+HeapDumpOnOutOfMemoryError'
    shouldRunAfter tasks.named('test')
    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
    }
}

tasks.named('check') {
    dependsOn tasks.named('testOnVm')
}
