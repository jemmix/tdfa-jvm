# Parallel execution for the rebar parity suite.
#
# Each parameterized scenario is independent (own Pattern, own Matcher,
# own haystack); the static counters in RebarScenarioParityTest are
# Atomic* / synchronized / ConcurrentHashMap, so the class is thread-safe
# by construction. 8 GB heap leaves comfortable headroom for 8 threads
# each holding up to an 80 MB haystack.
#
# 'dynamic' uses Runtime.getRuntime().availableProcessors() as the
# parallelism. Override on the CLI with:
#   -Djunit.jupiter.execution.parallel.config.dynamic.factor=0.5  # half the cores
#   -Djunit.jupiter.execution.parallel.config.dynamic.factor=2.0  # double (hyper-thread)
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 1.0
