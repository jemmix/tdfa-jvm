plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation project(':')
    testImplementation project(':testlib:rebar')
    // Vendored patched re2j (fix1: pair-interior literal prefix; fix2: FoldCase
    // in equals/hashCode) — the live oracle for the re2j-compat scenario class.
    testImplementation files(rootProject.file('vendor/re2j-jemmix/re2j-1.8-jemmix-fix2.jar'))
    testImplementation platform('org.junit:junit-bom:5.10.2'),
            'org.junit.jupiter:junit-jupiter',
            'org.assertj:assertj-core:3.25.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The rebar benchmarks tree (121 MB of haystacks) is too big to materialize
// per-build into build/generated/. Point the test at the pristine extraction
// maintained by :prepareVendor at build/vendor/rebar/pristine/rebar/benchmarks/.
def rebarBenchmarksDir = rootProject.layout.buildDirectory.dir(
        "vendor/rebar/pristine/rebar/benchmarks").get().asFile

tasks.named('compileTestJava') {
    dependsOn rootProject.tasks.named('prepareVendor')
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'rebar.benchmarks.dir', rebarBenchmarksDir.absolutePath
    // Each (scenario, backend) pair runs as its own parameterized test case
    // — EngineFactory.ASM and EngineFactory.VM both compile and run every
    // in-scope regex (out-of-scope scenarios are filtered at param-build
    // time; the one over-budget bomb skips by name unless opted in — see
    // RebarScenarioParityTest#BOMB_SCENARIOS). 2 GB heap: the largest
    // in-scope haystack is 39 MB (~80 MB UTF-16) and the largest under-
    // budget compile fits comfortably; even the skipped bomb (opt-in) now
    // fits 1 GB after the 2026-08-20 memory work — see TODO.md.
    jvmArgs '-Xmx2g'
    // Historical note: once ran with ignoreFailures=true masking failing
    // rebar scenarios; all in-scope scenarios now pass (718/718 as of the
    // 2026-08 restructure) and this is a hard gate.
    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
    }
}
