plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

// Glenn Fowler testregex corpus (vendored): .dat files as test resources.
// OpenJDK java.util.regex regression corpus (vendored): 3-line case files.
sourceSets {
    test {
        resources.srcDir rootProject.layout.buildDirectory.dir('generated/resources/testregex')
        resources.srcDir rootProject.layout.buildDirectory.dir('generated/resources/openjdk-regex')
    }
}

tasks.named('compileTestJava') {
    dependsOn rootProject.tasks.named('prepareVendor')
}

tasks.named('processTestResources') {
    dependsOn rootProject.tasks.named('prepareVendor')
}

dependencies {
    testImplementation project(':')
    testImplementation platform('org.junit:junit-bom:5.10.2'),
            'org.junit.jupiter:junit-jupiter',
            'org.assertj:assertj-core:3.25.3'
    // re2j as live oracle for parity comparison
    testImplementation 'com.google.re2j:re2j:1.8'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '-Xmx512m', '-XX:+HeapDumpOnOutOfMemoryError'
    // Forward -Dtdfa.pending=true so JdkRegressionCorpusTest known-bug families enforce.
    systemProperty 'tdfa.pending', System.getProperty('tdfa.pending', 'false')
    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
    }
}
