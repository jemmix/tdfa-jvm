plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

// Glenn Fowler testregex corpus (vendored): .dat files as test resources.
// OpenJDK java.util.regex regression corpus (vendored): 3-line case files.
sourceSets {
    test {
        resources.srcDir rootProject.layout.buildDirectory.dir('generated/resources/testregex')
        resources.srcDir rootProject.layout.buildDirectory.dir('generated/resources/openjdk-regex')
    }
}

tasks.named('compileTestJava') {
    dependsOn rootProject.tasks.named('prepareVendor')
}

tasks.named('processTestResources') {
    dependsOn rootProject.tasks.named('prepareVendor')
}

dependencies {
    testImplementation project(':')
    testImplementation project(':lib:pikesim')
    testImplementation project(':testlib:parity')
    testImplementation platform('org.junit:junit-bom:5.10.2'),
            'org.junit.jupiter:junit-jupiter',
            'org.assertj:assertj-core:3.25.3'
    // re2j as live oracle for parity comparison. The fuzz task can swap in a
    // patched build from our fork (-Pfuzz.patchedOracle=true) to fuzz against
    // the surrogate-pair-interior fix — see vendor/re2j-jemmix/README.md.
    // The patched jar is a build output (gitignored), built on demand from
    // the single committed pristine archive + per-fix patches.
    def patchedOracleJar = rootProject.file('vendor/re2j-jemmix/re2j-1.8-jemmix-fix2.jar')
    tasks.register('buildPatchedOracle', Exec) {
        group = 'build'
        description = 'Rebuild the patched re2j oracle jar (fix2) from the vendored pristine archive + patches'
        workingDir rootProject.projectDir
        commandLine './vendor/re2j-jemmix/build-patched.sh', '2'
        inputs.files fileTree(dir: rootProject.projectDir, include: [
                'vendor/archives/re2j-*.tar.gz', 'vendor/archives/re2j-*.tar.gz.sha256',
                'vendor/re2j-jemmix/patches/*.patch', 'vendor/re2j-jemmix/build-patched.sh'])
        outputs.file patchedOracleJar
    }
    if (project.hasProperty('fuzz.patchedOracle')) {
        tasks.named('compileTestJava') { dependsOn 'buildPatchedOracle' }
        testImplementation files(patchedOracleJar)
    } else {
        testImplementation 'com.google.re2j:re2j:1.8'
    }
    // bytecode policy check on the ASM-generated engine classes
    testImplementation 'org.ow2.asm:asm:9.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '-Xmx512m', '-XX:+HeapDumpOnOutOfMemoryError'
    systemProperty 'tdfa.asm.dump', System.getProperty('tdfa.asm.dump', 'false')
    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
    }
}

// Overnight differential soak: tdfa (both engines) vs re2j oracle.
//   ./gradlew :tests:parity:re2j:fuzz                      # 8h, logs to build/fuzz
//   ./gradlew :tests:parity:re2j:fuzz -Pfuzz.minutes=60 -Pfuzz.seed=42 -Pfuzz.out=/tmp/soak
// Chunked soak (hang-leak containment, shared out dir via append):
//   scripts/fuzz-soak.sh [iters=480] [minutes=1] [out=build/fuzz] [seedBase]
// Reproduce a failures.ndjson line turnkey:
//   ./gradlew :tests:parity:re2j:fuzz -Pfuzz.one=<caseSeed>
// Exits nonzero if any divergence found.
tasks.register('fuzz', JavaExec) {
    group = 'verification'
    description = 'Differential fuzz soak vs re2j (minutes/seed/out via -Pfuzz.*)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.jemmix.tdfa.fuzz.DifferentialFuzzer'
    jvmArgs '-Xmx2g'
    systemProperty 'fuzz.minutes', project.findProperty('fuzz.minutes') ?: '480'
    systemProperty 'fuzz.out', project.findProperty('fuzz.out')
            ?: rootProject.layout.buildDirectory.dir('fuzz').get().asFile.absolutePath
    systemProperty 'fuzz.seed', project.findProperty('fuzz.seed') ?: String.valueOf(System.currentTimeMillis())
    systemProperty 'fuzz.cases', project.findProperty('fuzz.cases') ?: '0'
    systemProperty 'fuzz.one', project.findProperty('fuzz.one') ?: '0'
    systemProperty 'fuzz.append', project.findProperty('fuzz.append') ?: 'false'
}
