plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

// Glenn Fowler testregex corpus (vendored): .dat files as test resources.
// OpenJDK java.util.regex regression corpus (vendored): 3-line case files.
sourceSets {
    test {
        resources.srcDir rootProject.layout.buildDirectory.dir('generated/resources/testregex')
        resources.srcDir rootProject.layout.buildDirectory.dir('generated/resources/openjdk-regex')
    }
}

tasks.named('compileTestJava') {
    dependsOn rootProject.tasks.named('prepareVendor')
}

tasks.named('processTestResources') {
    dependsOn rootProject.tasks.named('prepareVendor')
}

dependencies {
    testImplementation project(':')
    testImplementation platform('org.junit:junit-bom:5.10.2'),
            'org.junit.jupiter:junit-jupiter',
            'org.assertj:assertj-core:3.25.3'
    // re2j as live oracle for parity comparison
    testImplementation 'com.google.re2j:re2j:1.8'
    // bytecode policy check on the ASM-generated engine classes
    testImplementation 'org.ow2.asm:asm:9.9.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '-Xmx512m', '-XX:+HeapDumpOnOutOfMemoryError'
    // -Dtdfa.pending=true opts IN known-failing tests committed in interim
    // state (TODO.md convention). No currently-known failures: default off.
    systemProperty 'tdfa.pending', System.getProperty('tdfa.pending', 'false')
    systemProperty 'tdfa.asm.dump', System.getProperty('tdfa.asm.dump', 'false')
    testLogging {
        events 'failed', 'standardOut', 'standardError'
        exceptionFormat 'full'
    }
}

// Overnight differential soak: tdfa (both engines) vs re2j oracle.
//   ./gradlew :tests:parity:re2j:fuzz                      # 8h, logs to build/fuzz
//   ./gradlew :tests:parity:re2j:fuzz -Pfuzz.minutes=60 -Pfuzz.seed=42 -Pfuzz.out=/tmp/soak
// Reproduce a failures.ndjson line: -Dfuzz.one=<caseSeed> (run the main class
// with the test runtime classpath). Exits nonzero if any divergence found.
tasks.register('fuzz', JavaExec) {
    group = 'verification'
    description = 'Differential fuzz soak vs re2j (minutes/seed/out via -Pfuzz.*)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.jemmix.tdfa.fuzz.DifferentialFuzzer'
    jvmArgs '-Xmx2g'
    systemProperty 'fuzz.minutes', project.findProperty('fuzz.minutes') ?: '480'
    systemProperty 'fuzz.out', project.findProperty('fuzz.out')
            ?: rootProject.layout.buildDirectory.dir('fuzz').get().asFile.absolutePath
    systemProperty 'fuzz.seed', project.findProperty('fuzz.seed') ?: String.valueOf(System.currentTimeMillis())
    systemProperty 'fuzz.cases', project.findProperty('fuzz.cases') ?: '0'
}
