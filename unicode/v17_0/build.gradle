plugins {
    id 'java-library'
}

group = 'io.github.jemmix'
// Artifact: io.github.jemmix:tdfa-unicode-17.0 — Unicode 17.0.0 tables (current stable at generation time).
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':core')
}

// Deterministic regeneration from vendored UCD files (checksums verified
// by the generator). Committed output — python3 only needed to regenerate.
tasks.register('generateTables', Exec) {
    description = 'Regenerate Unicode17_0.java from vendor/ucd/17.0.0.'
    group = 'build'
    commandLine 'python3', rootProject.file('scripts/gen-unicode.py').absolutePath,
            rootProject.file('vendor/ucd/17.0.0').absolutePath, '17_0', '17.0.0',
            file('src/gen/java/io/github/jemmix/tdfa/unicode/v17_0/Unicode17_0.java').absolutePath
}

sourceSets {
    main {
        java.srcDir 'src/gen/java'
    }
}


jar {
    manifest {
        attributes 'Automatic-Module-Name': 'io.github.jemmix.tdfa.unicode.v17_0'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = true
}
