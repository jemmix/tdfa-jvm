plugins {
    id 'java-library'
}

group = 'io.github.jemmix'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':core')
}

jar {
    manifest {
        attributes 'Automatic-Module-Name': 'io.github.jemmix.tdfa.sim'
    }
}

// Java 8 bytecode floor (2026-09, docs/REVIEW-2026-09.md §1b): this module
// SHIPS, so it compiles with --release 8 — language level AND API surface are
// both compiler-enforced.
tasks.withType(JavaCompile).configureEach {
    it.options.release = 8
}
