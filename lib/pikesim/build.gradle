plugins {
    id 'java-library'
}

group = 'io.github.jemmix'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':core')
}

jar {
    manifest {
        attributes 'Automatic-Module-Name': 'io.github.jemmix.tdfa.sim'
    }
}

// Floor policy (2026-09 r4, docs/REVIEW-2026-09.md §1d): this module SHIPS
// as Java 25 bytecode (latest LTS) — --release 25 enforces language level
// AND API surface.
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}
