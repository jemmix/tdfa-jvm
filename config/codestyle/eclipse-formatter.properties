# tdfa formatter profile (Eclipse JDT properties; consumed by spotless).
# Mirrors config/codestyle/tdfa-idea.xml and config/codestyle/checkstyle.xml
# — change all three together. Applied via the root build.gradle; run
# ./gradlew spotlessApply (or scripts/format.sh) to reformat.
#
# Core rules:
#   - 4-space indent, spaces only; FLAT 4-space continuation indent
#   - right margin 120; wraps that fit are joined
#
# The two families of keys that make the continuation flat (and that the
# engine defaults get wrong — do not drop them silently):
#   - continuation_indentation=4: the unit. JDT multiplies it by wrap-nesting
#     depth, so with the wrap-where-necessary policies below the common case
#     (a single wrap at depth 1) is exactly +4; deeper nesting only occurs
#     where a wrap inside a wrap is unavoidable.
#   - alignment_for_*=2 (M_COMPACT_SPLIT, "wrap where necessary"): default
#     for several of these is 16, which encodes M_INDENT_ON_COLUMN — the
#     source of the 16-space continuations seen with the raw defaults. 0
#     joins by policy, 64 explodes one-per-line; 2 is the only sane value.

# Parser level: highest source level in the tree (tests/testlib are Java 25;
# core/asm/facade Java 8 is a strict subset, so one profile covers all).
org.eclipse.jdt.core.compiler.source=25
org.eclipse.jdt.core.compiler.compliance=25

# --- indentation: 4 spaces everywhere, continuation unit 4 ---
org.eclipse.jdt.core.formatter.tabulation.char=space
org.eclipse.jdt.core.formatter.tabulation.size=4
org.eclipse.jdt.core.formatter.indentation.size=4
org.eclipse.jdt.core.formatter.continuation_indentation=4
org.eclipse.jdt.core.formatter.continuation_indentation_for_array_initializer=4
org.eclipse.jdt.core.formatter.use_tabs_only_for_leading_indentations=false

# --- right margin; wraps that fit are joined ---
org.eclipse.jdt.core.formatter.lineSplit=120
org.eclipse.jdt.core.formatter.join_wrapped_lines=true
org.eclipse.jdt.core.formatter.wrap_outer_expressions_when_nested=true

# --- comments: leave all comment bodies byte-identical ---
org.eclipse.jdt.core.formatter.join_lines_in_comments=false
org.eclipse.jdt.core.formatter.comment.format_line_comments=false
org.eclipse.jdt.core.formatter.comment.format_block_comments=false
org.eclipse.jdt.core.formatter.comment.format_javadoc_comments=false
org.eclipse.jdt.core.formatter.comment.line_length=120
org.eclipse.jdt.core.formatter.comment.count_line_length_from_starting_position=false

# --- wrap-where-necessary family (see header: never on-column, never
#     one-per-line) ---
org.eclipse.jdt.core.formatter.alignment_for_arguments_in_method_invocation=2
org.eclipse.jdt.core.formatter.alignment_for_binary_expression=2
org.eclipse.jdt.core.formatter.alignment_for_assignment=2
org.eclipse.jdt.core.formatter.alignment_for_conditional_expression=2
org.eclipse.jdt.core.formatter.alignment_for_selector_in_method_invocation=2
org.eclipse.jdt.core.formatter.alignment_for_parameters_in_method_declaration=2
org.eclipse.jdt.core.formatter.alignment_for_allocation_expression=2
org.eclipse.jdt.core.formatter.alignment_for_expressions_in_array_initializer=2
org.eclipse.jdt.core.formatter.alignment_for_throws_clause_in_method_declaration=2

# --- braces: K&R (end of line), matching the existing code ---
org.eclipse.jdt.core.formatter.brace_position_for_type_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_method_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_constructor_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_anonymous_type_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_block=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_block_in_case=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_switch=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_array_initializer=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_enum_declaration=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_enum_constant=end_of_line
org.eclipse.jdt.core.formatter.brace_position_for_lambda=end_of_line

# --- blank lines: preserve existing structure ---
org.eclipse.jdt.core.formatter.number_of_empty_lines_to_preserve=1
org.eclipse.jdt.core.formatter.blank_lines_before_package=0
org.eclipse.jdt.core.formatter.blank_lines_after_package=1
org.eclipse.jdt.core.formatter.blank_lines_before_field=0
org.eclipse.jdt.core.formatter.blank_lines_before_method=1
